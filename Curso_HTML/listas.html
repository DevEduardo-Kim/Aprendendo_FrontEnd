<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas - Ordenadas & Não Ordenadas</title>
</head>
<body>
    <!--Listas Ordenadas - A ordem importa-->
    <h3>Sumário</h3>
    <ol>
        <li>
            <h4>Introdução</h4>
            <ul>
                <li>Conceitos</li>
                <li>Anatomia</li>
                <li>Fluxo de atividade</li>
            </ul>
        </li>
        <li>Headings - Cabeçalhos </li>
        <li>Parágrafos</li>
        <li>Listas</li>
        <li>Adicionando Imagem</li>
    </ol>

    <!--Listas Não Ordenadas - Ordem não é importante-->
    <h3>Melhor Forma de Estudar</h3>
    <ul>
        <li>Teoria - 20%</li>
        <li>Prática - 80%</li>
        <li>Dúvida - Revise apenas aquilo que não entendeu.</li>
    </ul>
</body>
</html>
