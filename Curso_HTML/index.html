<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>

<!--

Teoria Da Estrutura HTML

<!doctype html> -> Conjunto de regras que define o documento HTML.

<html> -> Elemento raiz do documento HTML, que envolve todo o conteúdo do documento.

<head> -> Esse elemento contém informações sobre o documento. Esse elemento age como um recipiente de tudo o que você deseja incluir em uma página HTML que não é o conteúdo que é mostrado na busca da página.

<meta charset="UTF-8"> -> Define a codificação de caracteres do documento HTML.

<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

-> Define a largura da viewport para corresponder à largura do dispositivo e define o nível de zoom inicial. 

<body> -> Esse elemento contém todo o conteúdo visível do documento, como textos , imagens , vídeos , hiperlinks , botões , formulários e outros elementos.

-->
